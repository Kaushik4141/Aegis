services:
  gateway:
    image: node:20-slim
    working_dir: /repo
    command: sh -c "npm install --no-audit --no-fund && npx tsx src/index.ts"
    environment:
      PORT: "8787"
      SENTINEL_ADMIN_TOKEN: ${SENTINEL_ADMIN_TOKEN:-}
      SENTINEL_SHADOW_WATCHLIST: ${SENTINEL_SHADOW_WATCHLIST:-}
    volumes:
      - ../../:/repo
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped

  sandbox:
    image: node:20-slim
    working_dir: /repo/apps/sandbox
    # The service creates sibling containers through the VM's Docker socket.
    command: sh -c "npm install --no-audit --no-fund --workspace root --prefix /repo >/dev/null 2>&1; npx tsx src/index.ts"
    environment:
      AEGIS_SANDBOX_PORT: "8788"
      # Containers reach this service and the gateway through the VM host.
      AEGIS_SANDBOX_CONTAINER_EVENT_URL: http://host.docker.internal:8788/internal/events
      AEGIS_GATEWAY_INTERNAL_URL: http://host.docker.internal:8787/api/v1
      AEGIS_GATEWAY_URL: http://gateway:8787/api/v1
      SENTINEL_ADMIN_TOKEN: ${SENTINEL_ADMIN_TOKEN:-}
      SENTINEL_SHADOW_WATCHLIST: ${SENTINEL_SHADOW_WATCHLIST:-}
      DOCKER_HOST: ${AEGIS_REMOTE_DOCKER_HOST:-}
    volumes:
      - ../../:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8788:8788"
    restart: unless-stopped
    depends_on:
      - gateway

  web:
    image: node:20-slim
    working_dir: /repo/apps/web
    command: sh -c "npm install --no-audit --no-fund --workspace root --prefix /repo >/dev/null 2>&1; npx next dev -p 3000 -H 0.0.0.0"
    environment:
      GATEWAY_URL: http://gateway:8787
      SANDBOX_URL: http://sandbox:8788
      NEXT_PUBLIC_SANDBOX_WS_URL: ${AEGIS_PUBLIC_WS_URL:-ws://localhost:8788}
    volumes:
      - ../../:/repo
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - gateway
      - sandbox

[package]
name = "aegis-desktop"
version = "0.1.0"
description = "Aegis Control Plane desktop app: monitored sandboxes for your own agents"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aegis</title>
    <style>
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: #0b1020; color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .wrap { width: 340px; text-align: center; }
      .logo {
        width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 10px;
        background: #172154; display: grid; place-items: center;
        color: #fff; font-weight: 800; font-size: 18px;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { font-size: 11px; color: #7d8aa5; margin: 0 0 18px; }
      ul { list-style: none; padding: 0; margin: 0; font-size: 12px; text-align: left; }
      li {
        display: flex; justify-content: space-between; padding: 7px 12px;
        border: 1px solid #1d2742; border-radius: 8px; margin-bottom: 6px;
      }
      li span.state { font-weight: 700; }
      .ok { color: #34d399; } .wait { color: #fbbf24; } .fail { color: #f87171; }
      .error { display: none; margin-top: 14px; font-size: 11px; color: #f87171; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Ae</div>
      <h1>Aegis Control Plane</h1>
      <p class="sub">Starting monitored agent services…</p>
      <ul>
        <li>Policy gateway <span class="state wait" id="gateway">starting</span></li>
        <li>Sandbox service <span class="state wait" id="sandbox">starting</span></li>
        <li>Docker <span class="state wait" id="docker">checking</span></li>
        <li>Dashboard <span class="state wait" id="web">starting</span></li>
      </ul>
      <div class="error" id="error"></div>
    </div>
    <script>
      const started = Date.now();
      const invoke = () => window.__TAURI__?.core?.invoke;
      function mark(id, ok, waiting) {
        const el = document.getElementById(id);
        el.textContent = ok ? "ready" : waiting ? "starting" : "failed";
        el.className = "state " + (ok ? "ok" : waiting ? "wait" : "fail");
      }
      async function poll() {
        try {
          const status = await invoke()("service_status");
          mark("gateway", status.gateway, true);
          mark("sandbox", status.sandbox, true);
          mark("docker", status.docker, status.sandbox);
          mark("web", status.web, true);
          if (status.gateway && status.sandbox && status.web) {
            window.location.href = "http://localhost:3000";
            return;
          }
        } catch (e) {
          /* tauri IPC not ready yet */
        }
        if (Date.now() - started > 120000) {
          document.querySelector(".sub").textContent = "Services did not come up.";
          const box = document.getElementById("error");
          box.style.display = "block";
          box.textContent = "Check logs under data/desktop-logs/ in the repository, then restart Aegis.";
          return;
        }
        setTimeout(poll, 1000);
      }
      poll();
    </script>
  </body>
</html>
